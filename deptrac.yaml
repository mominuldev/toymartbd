# Domain boundaries — docs/SYSTEM-ARCHITECTURE.md §4. Generated by hand; keep the
# domain list in sync with app/Domain. `make arch` runs it; CI fails on any violation.
#
#   Http      → any Domain, Support, Models
#   Domain X  → itself, Catalog, Customer, Support, Models, and any domain's Events
#               (cross-domain writes go through events only)
#   Ordering  → also Inventory (reserve/release inside the order's own transaction, §4.1/§4.4)
#               and Payment (open/cancel payments in the same transaction; drivers, rule 5).
#               Neither depends back on Ordering: Payment reports through PaymentStatusChanged.
#   Support   → nothing in the app (pure value objects and helpers)
deptrac:
  paths:
    - ./app
  layers:
    - name: Http
      collectors:
        - type: classNameRegex
          value: '#^App\\Http\\#'
    - name: Support
      collectors:
        - type: classNameRegex
          value: '#^App\\Support\\#'
    - name: Models
      collectors:
        - type: classNameRegex
          value: '#^App\\Models\\#'
    - name: Providers
      collectors:
        - type: classNameRegex
          value: '#^App\\Providers\\#'
    - name: DomainEvents
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\[A-Za-z]+\\Events\\#'
    - name: Catalog
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Catalog\\(?!Events\\)#'
    - name: Inventory
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Inventory\\(?!Events\\)#'
    - name: Cart
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Cart\\(?!Events\\)#'
    - name: Ordering
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Ordering\\(?!Events\\)#'
    - name: Payment
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Payment\\(?!Events\\)#'
    - name: Fulfilment
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Fulfilment\\(?!Events\\)#'
    - name: Risk
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Risk\\(?!Events\\)#'
    - name: Finance
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Finance\\(?!Events\\)#'
    - name: Customer
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Customer\\(?!Events\\)#'
    - name: Marketing
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Marketing\\(?!Events\\|Contracts\\(PersonalCouponIssuer|PersonalCouponTerms|IssuedCoupon)$)#'
    # Personal coupons (P8 batch 3): the seam Notification calls to mint a birthday-offer
    # coupon without writing Marketing's tables (rule 2). Marketing implements it.
    - name: MarketingContracts
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Marketing\\Contracts\\(PersonalCouponIssuer|PersonalCouponTerms|IssuedCoupon)$#'
    - name: Content
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Content\\(?!Events\\)#'
    - name: Seo
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Seo\\(?!Events\\|Contracts\\)#'
    # SEO subject contract (P7, docs/api/seo.md §1): Content's pages, posts and guides plug
    # into the SEO module (panel, sitemap, redirects) without depending on Seo internals.
    - name: SeoContracts
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Seo\\Contracts\\#'
    - name: Tracking
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Tracking\\(?!Events\\)#'
    # Purchasing (P5): suppliers, POs, receipts, supplier payments. Receives stock through
    # Inventory's ReceivePurchasedStock inside its own transaction (§4.6), like Ordering does.
    - name: Purchasing
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Purchasing\\(?!Events\\)#'
    # Notifications (P4-NOT-01..03). Contracts + DTOs are their own layer so any domain
    # (Customer OTP login) can send an SMS without depending on the rest of Notification.
    - name: NotificationContracts
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Notification\\(Contracts|DTOs)\\#'
    - name: Notification
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Notification\\(?!Events\\|Contracts\\|DTOs\\)#'
    # Product search (P4-CAT-14). Reads the catalog and stock availability to build index
    # documents; nothing depends on it except Http and Providers.
    - name: Search
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Search\\(?!Events\\)#'
    # Reporting (P8): read-only analytics over orders, the ledger and the catalog — sales,
    # dashboard and customer analytics queries, exports, scheduled report emails. It never
    # writes to another domain's tables; nothing depends on it except Http and Providers.
    - name: Reporting
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Reporting\\(?!Events\\)#'
    # Invoicing (P8, PRD N-13): issued invoices snapshot an order or a PO at issue and are
    # immutable afterwards. Reads Ordering, Purchasing and (credit notes)
    # Payment refunds; writes only `invoices`, `credit_notes` and their number sequence.
    # Nothing depends on it except Http and Providers.
    - name: Invoicing
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Invoicing\\(?!Events\\)#'
    # Monitoring (P10, SYSTEM-ARCHITECTURE §11): business alerts. Reads orders, shipments and
    # notification logs; writes only `monitoring_alerts`; sends through NotificationContracts.
    - name: Monitoring
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Monitoring\\(?!Events\\)#'
  ruleset:
    Http: [Support, Models, DomainEvents, Catalog, Inventory, Cart, Ordering, Payment, Fulfilment, Risk, Finance, Customer, Marketing, Content, Seo, Tracking, Search, Notification, NotificationContracts, Purchasing, SeoContracts, Reporting, Invoicing, MarketingContracts, Monitoring]
    Support: ~
    Models: [Support]
    Providers: [Http, Support, Models, DomainEvents, Catalog, Inventory, Cart, Ordering, Payment, Fulfilment, Risk, Finance, Customer, Marketing, Content, Seo, Tracking, Search, Notification, NotificationContracts, Purchasing, SeoContracts, Reporting, Invoicing, MarketingContracts, Monitoring]
    DomainEvents: [Support, Models, Catalog, Customer]
    Catalog: [Support, Models, DomainEvents, Customer]
    Inventory: [Support, Models, DomainEvents, Catalog, Customer]
    # Cart prices through Marketing (promotions, coupons), Fulfilment (DeliveryChargeResolver)
    # and reads Inventory availability (P4-CRT-01/02).
    Cart: [Support, Models, DomainEvents, Catalog, Customer, Inventory, Fulfilment, Marketing]
    # Ordering implements Marketing's order-history seam; batch 5 PlaceOrder prices through Cart
    # and asks Risk for its advisory assessment (Risk never depends back on Ordering).
    Ordering: [Support, Models, DomainEvents, Catalog, Customer, Inventory, Payment, Cart, Marketing, Fulfilment, Risk]
    Payment: [Support, Models, DomainEvents, Catalog, Customer]
    Fulfilment: [Support, Models, DomainEvents, Catalog, Customer]
    Risk: [Support, Models, DomainEvents, Catalog, Customer]
    # Finance reads orders (delivery revenue, COGS snapshots, receivables) and the receipt
    # checks in Catalog; Ordering never depends back on Finance. It writes only its own tables
    # plus the order_financials projection it owns (§3.4).
    Finance: [Support, Models, DomainEvents, Catalog, Customer, Ordering]
    Customer: [Support, Models, DomainEvents, Catalog, NotificationContracts]
    # Marketing implements Fulfilment's FreeShippingPromotion seam (free-shipping coupons).
    Marketing: [Support, Models, DomainEvents, Catalog, Customer, Fulfilment, MarketingContracts]
    # Content reaches the SEO module only through SeoContracts (subject providers, SeoMetaStore)
    # and Seo events (SlugChanged, SeoPagesStale) — never Seo internals, so there is no cycle.
    Content: [Support, Models, DomainEvents, Catalog, Customer, SeoContracts]
    # Seo writes a static page with its seo_meta/slug_history (SaveCmsPageWithSeo), as it does
    # products, and reads static pages for their SEO subjects. One direction only: Seo → Content.
    Seo: [Support, Models, DomainEvents, Catalog, Customer, Content, SeoContracts]
    # Tracking (P7 batch 2) reads orders to build purchase/refund conversions (never writes
    # them) and queues Content's storefront revalidation job for `tracking-config`.
    # Nothing depends back on Tracking except Http and Providers.
    Tracking: [Support, Models, DomainEvents, Catalog, Customer, Ordering, Content]
    Purchasing: [Support, Models, DomainEvents, Catalog, Customer, Inventory]
    Search: [Support, Models, DomainEvents, Catalog, Inventory, Customer]
    NotificationContracts: [Support]
    MarketingContracts: [Support]
    SeoContracts: ~
    # Notification reads orders and customers to render messages; nothing depends back on it
    # except through NotificationContracts. It writes only its own tables. P7: it also reads
    # carts for abandoned-cart recovery (cart_recoveries is Notification's table).
    Notification: [Support, Models, DomainEvents, Catalog, Customer, Ordering, Cart, NotificationContracts, MarketingContracts]
    # Reporting reads the read models of the domains it reports on (P8 batch 1 brief).
    Reporting: [Support, Models, DomainEvents, Catalog, Customer, Ordering, Finance, Inventory, Fulfilment]
    # Credit notes (P8 batch 2) read the paid refund (Payment\Models\Refund) they credit.
    Invoicing: [Support, Models, DomainEvents, Catalog, Customer, Ordering, Purchasing, Payment]
    # Monitoring reads the domains it watches (P10); nothing depends on it except Http and Providers.
    Monitoring: [Support, Models, DomainEvents, Catalog, Customer, Ordering, Fulfilment, Notification, NotificationContracts]
