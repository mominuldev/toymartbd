# Domain boundaries — docs/SYSTEM-ARCHITECTURE.md §4. Generated by hand; keep the
# domain list in sync with app/Domain. `make arch` runs it; CI fails on any violation.
#
#   Http      → any Domain, Support, Models
#   Domain X  → itself, Catalog, Customer, Support, Models, and any domain's Events
#               (cross-domain writes go through events only)
#   Support   → nothing in the app (pure value objects and helpers)
deptrac:
  paths:
    - ./app
  layers:
    - name: Http
      collectors:
        - type: classNameRegex
          value: '#^App\\Http\\#'
    - name: Support
      collectors:
        - type: classNameRegex
          value: '#^App\\Support\\#'
    - name: Models
      collectors:
        - type: classNameRegex
          value: '#^App\\Models\\#'
    - name: Providers
      collectors:
        - type: classNameRegex
          value: '#^App\\Providers\\#'
    - name: DomainEvents
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\[A-Za-z]+\\Events\\#'
    - name: Catalog
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Catalog\\(?!Events\\)#'
    - name: Inventory
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Inventory\\(?!Events\\)#'
    - name: Cart
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Cart\\(?!Events\\)#'
    - name: Ordering
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Ordering\\(?!Events\\)#'
    - name: Payment
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Payment\\(?!Events\\)#'
    - name: Fulfilment
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Fulfilment\\(?!Events\\)#'
    - name: Risk
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Risk\\(?!Events\\)#'
    - name: Finance
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Finance\\(?!Events\\)#'
    - name: Customer
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Customer\\(?!Events\\)#'
    - name: Marketing
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Marketing\\(?!Events\\)#'
    - name: Content
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Content\\(?!Events\\)#'
    - name: Seo
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Seo\\(?!Events\\)#'
    - name: Tracking
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Tracking\\(?!Events\\)#'
    # Product search (P4-CAT-14). Reads the catalog and stock availability to build index
    # documents; nothing depends on it except Http and Providers.
    - name: Search
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\Search\\(?!Events\\)#'
  ruleset:
    Http: [Support, Models, DomainEvents, Catalog, Inventory, Cart, Ordering, Payment, Fulfilment, Risk, Finance, Customer, Marketing, Content, Seo, Tracking, Search]
    Support: ~
    Models: [Support]
    Providers: [Http, Support, Models, DomainEvents, Catalog, Inventory, Cart, Ordering, Payment, Fulfilment, Risk, Finance, Customer, Marketing, Content, Seo, Tracking, Search]
    DomainEvents: [Support, Models, Catalog, Customer]
    Catalog: [Support, Models, DomainEvents, Customer]
    Inventory: [Support, Models, DomainEvents, Catalog, Customer]
    Cart: [Support, Models, DomainEvents, Catalog, Customer]
    Ordering: [Support, Models, DomainEvents, Catalog, Customer]
    Payment: [Support, Models, DomainEvents, Catalog, Customer]
    Fulfilment: [Support, Models, DomainEvents, Catalog, Customer]
    Risk: [Support, Models, DomainEvents, Catalog, Customer]
    Finance: [Support, Models, DomainEvents, Catalog, Customer]
    Customer: [Support, Models, DomainEvents, Catalog]
    Marketing: [Support, Models, DomainEvents, Catalog, Customer]
    Content: [Support, Models, DomainEvents, Catalog, Customer]
    Seo: [Support, Models, DomainEvents, Catalog, Customer]
    Tracking: [Support, Models, DomainEvents, Catalog, Customer]
    Search: [Support, Models, DomainEvents, Catalog, Inventory, Customer]
