name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — Pint, PHPStan, deptrac, Pest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: toymartbd_testing
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-retries=20
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd (with WebP + AVIF) and exif: the media pipeline (config/media.php).
          extensions: bcmath, intl, mbstring, pdo_mysql, pdo_sqlite, gd, exif, fileinfo
          coverage: none
      - name: GD must encode WebP and AVIF (media pipeline)
        run: |
          php -r "\$i = gd_info(); exit(!empty(\$i['WebP Support']) && !empty(\$i['AVIF Support']) && function_exists('exif_read_data') ? 0 : 1);"
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan (level 6)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
      - name: deptrac
        run: vendor/bin/deptrac analyse --no-progress
      - name: Pest (SQLite)
        env:
          # Every route a RoleMatrix assertion reaches is appended here (tests/Support/RoleMatrixCoverage.php).
          ROLE_MATRIX_COVERAGE_FILE: ${{ runner.temp }}/role-matrix-coverage.log
        run: php artisan test --parallel
      - name: Role matrix coverage (rule 21)
        run: php scripts/role-matrix-coverage.php verify "${{ runner.temp }}/role-matrix-coverage.log"
      - name: Pest (MySQL 8.4 group — collation, locking)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: toymartbd_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: vendor/bin/pest --group=mysql
      - name: Load harness (MySQL — checkout, flash burst, bulk booking at 10x)
        # tests/Load/README.md. Its own throwaway database; asserts no oversell, unique gap-free
        # numbers, flash allotment never exceeded, each bulk booking submitted exactly once, 0 errors.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: toymartbd_load
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          mysql -h 127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS toymartbd_load CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          # p95 is loose here: a shared 4-vCPU runner proves correctness, not latency (staging run = owner).
          php tests/Load/run.php --port=8341 --workers=16 --queue-workers=4 --p95-ms=15000 --report="${{ runner.temp }}/load-report.json"

  frontend:
    name: Frontend — tokens, typecheck, admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Tokens are fresh and pass the contrast gate
        run: npm run check --workspace=@toymart/tokens
      - name: API types match the committed OpenAPI spec
        run: npm run api-types:generate && git diff --exit-code packages/api-types/src
      - name: Typecheck
        run: npm run typecheck
      - name: i18n — gate self-tests, no hardcoded admin copy, every admin key in en and bn
        run: node --test scripts/i18n/i18n.test.mjs && npm run lint:i18n:admin
      - name: Vitest (admin)
        run: npm test
      - name: Build admin bundle
        run: npm run build
      # ESLint is not wired yet: typescript-eslint's support for the TypeScript 7
      # native compiler is unverified. resources/js/admin/test/conventions.test.ts
      # covers the two rules that matter most (no hardcoded strings, hex or px).

  storefront:
    name: Storefront — typecheck, unit, build, e2e (JS disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium  # browser only: the runner image already has its system libraries, and apt mirrors are not always reachable
      - name: Typecheck
        run: npm run typecheck:storefront
      - name: i18n — no hardcoded storefront copy, every storefront key in en and bn
        run: npm run lint:i18n:storefront
      - name: Unit tests (revalidation HMAC, API client, i18n)
        run: npm run test:storefront
      - name: Build
        run: npm run build:storefront
      - name: E2E — SSR without JS, no locale redirect, ISR revalidation, no secrets in bundles, Bangla layout at 390/1440, golden path in both locales, axe + keyboard in both locales, performance budgets (UI-UX §8)
        env:
          CI: '1'
        run: npm run test:e2e:storefront
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-playwright-report
          path: toymartbd-app/storefront/playwright-report

  admin-e2e:
    name: Admin E2E — login, brand create/edit/archive on the real app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, gd, exif, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate
      - name: npm ci
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium  # browser only: the runner image already has its system libraries, and apt mirrors are not always reachable
      - name: Build admin bundle
        run: npm run build
      - name: Playwright (admin)
        env:
          CI: '1'
        run: npm run test:e2e:admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: e2e/admin/playwright-report
