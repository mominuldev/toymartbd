name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — Pint, PHPStan, deptrac, Pest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: toymartbd_testing
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-retries=20
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan (level 6)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
      - name: deptrac
        run: vendor/bin/deptrac analyse --no-progress
      - name: Pest (SQLite)
        run: php artisan test
      - name: Pest (MySQL 8.4 group — collation, locking)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: toymartbd_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: vendor/bin/pest --group=mysql

  frontend:
    name: Frontend — tokens, typecheck, admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Tokens are fresh and pass the contrast gate
        run: npm run check --workspace=@toymart/tokens
      - name: API types match the committed OpenAPI spec
        run: npm run api-types:generate && git diff --exit-code packages/api-types/src
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest (admin)
        run: npm test
      - name: Build admin bundle
        run: npm run build
      # ESLint is not wired yet: typescript-eslint's support for the TypeScript 7
      # native compiler is unverified. resources/js/admin/test/conventions.test.ts
      # covers the two rules that matter most (no hardcoded strings, hex or px).

  storefront:
    name: Storefront — typecheck, unit, build, e2e (JS disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium  # browser only: the runner image already has its system libraries, and apt mirrors are not always reachable
      - name: Typecheck
        run: npm run typecheck:storefront
      - name: Unit tests (revalidation HMAC, API client, i18n)
        run: npm run test:storefront
      - name: Build
        run: npm run build:storefront
      - name: E2E — SSR without JS, no locale redirect, ISR revalidation, no secrets in bundles
        env:
          CI: '1'
        run: npm run test:e2e:storefront
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-playwright-report
          path: toymartbd-app/storefront/playwright-report

  admin-e2e:
    name: Admin E2E — login, brand create/edit/archive on the real app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate
      - name: npm ci
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium  # browser only: the runner image already has its system libraries, and apt mirrors are not always reachable
      - name: Build admin bundle
        run: npm run build
      - name: Playwright (admin)
        env:
          CI: '1'
        run: npm run test:e2e:admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: e2e/admin/playwright-report
