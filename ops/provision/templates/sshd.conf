# Toy Mart BD — SSH hardening (ops/provision). /etc/ssh/sshd_config.d/60-toymartbd.conf
# Applied only once a key-based login exists for root or a sudo user, so the owner is never
# locked out (provision.sh checks first).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 4
