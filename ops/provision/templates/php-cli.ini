; Toy Mart BD — PHP CLI overrides (ops/provision). /etc/php/8.4/cli/conf.d/99-toymartbd.ini
; Horizon workers, the scheduler and artisan. Horizon's own per-worker limit is 256 MB
; (config/horizon.php); this is the ceiling for one-off commands (exports, backups, reindex).
expose_php = Off
memory_limit = 512M
date.timezone = UTC
