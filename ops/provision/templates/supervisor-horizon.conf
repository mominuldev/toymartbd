; Toy Mart BD — Horizon under Supervisor (ops/provision). /etc/supervisor/conf.d/toymartbd-horizon.conf
; `php artisan horizon:terminate` (run by every deploy) lets in-flight jobs finish and exits;
; Supervisor then starts it again from `current`, i.e. on the new release.
[program:toymartbd-horizon]
process_name=%(program_name)s
command=/usr/bin/php8.4 {{APP_ROOT}}/current/artisan horizon
directory={{APP_ROOT}}/current
user={{DEPLOY_USER}}
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
; Longest job timeout is the reports queue at 600 s (config/horizon.php) — let it finish.
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/var/log/toymartbd/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
