; Toy Mart BD — PHP-FPM pool (ops/provision/provision.sh). Rendered on the host.
; Runs as the deploy user, which owns the releases and shared/storage; nginx (www-data) reaches
; it through the socket only.
[toymartbd]
user = {{DEPLOY_USER}}
group = {{DEPLOY_USER}}
listen = /run/php/php8.4-fpm-toymartbd.sock
listen.owner = {{DEPLOY_USER}}
listen.group = www-data
listen.mode = 0660

; Sized for a small VPS: max_children = (RAM − what MySQL, Redis and Meilisearch need) / ~64 MB
; per worker, computed by provision.sh (override PHP_FPM_MAX_CHILDREN in provision.env).
pm = dynamic
pm.max_children = {{FPM_MAX_CHILDREN}}
pm.start_servers = {{FPM_START_SERVERS}}
pm.min_spare_servers = {{FPM_MIN_SPARE}}
pm.max_spare_servers = {{FPM_MAX_SPARE}}
pm.max_requests = 500

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/toymartbd/php-fpm-slow.log

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/toymartbd/php-fpm-error.log
php_admin_value[memory_limit] = 256M

security.limit_extensions = .php
