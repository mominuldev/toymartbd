# Toy Mart BD — nginx, http-level settings (ops/provision). Rendered by provision.sh; edit the
# template in the repo, never this file on the host.

server_tokens off;

# X-Request-Id: keep the caller's (the storefront forwards its own), else nginx's $request_id.
# The app validates the format again (App\Http\Middleware\AssignRequestId).
map $http_x_request_id $toymart_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# One JSON object per request. No query string (it can carry an order-tracking phone), no
# cookies, no Authorization — CLAUDE.md rule 20.
log_format toymart_json escape=json
    '{"time":"$time_iso8601","request_id":"$toymart_request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstream_duration":"$upstream_response_time",'
    '"user_agent":"$http_user_agent","host":"$host"}';

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml application/xml;
