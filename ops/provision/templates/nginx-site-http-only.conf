# Toy Mart BD — before the TLS certificate exists (ops/provision/provision.sh). Serves the ACME
# challenge only; everything else gets a 503 until certbot succeeds and the full site replaces this.
server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAMES}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503 "TLS certificate pending - re-run ops/provision/provision.sh once DNS points here.\n";
    }
}
