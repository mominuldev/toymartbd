// Toy Mart BD — unattended upgrades (ops/provision). /etc/apt/apt.conf.d/52toymartbd-unattended
// Ubuntu SECURITY updates only, applied nightly. PHP (ondrej PPA), MySQL (repo.mysql.com) and
// Meilisearch are NOT upgraded automatically: a restart of the database or a PHP minor change
// is a planned, monthly step (docs/ops/DEPLOYMENT.md §8).
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
// A kernel update needs a reboot; the owner picks the quiet hour (/var/run/reboot-required).
Unattended-Upgrade::Automatic-Reboot "false";
