# Toy Mart BD — API + admin vhost (ops/provision/provision.sh, docs/ops/DEPLOYMENT.md).
# Rendered on the host; edit the template in the repo.
#
# Headers: HSTS, nosniff, X-Frame-Options, Referrer-Policy, Permissions-Policy and the CSPs are
# set by the app (App\Http\Middleware\SecurityHeaders) on every response Laravel serves — HSTS
# whenever the request is HTTPS, which nginx tells PHP through fastcgi_params' `HTTPS`. They are
# deliberately NOT repeated here: two Strict-Transport-Security headers with different values
# is a defect. Only the static locations below, which never reach PHP, add nosniff themselves.

server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAMES}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen … http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24, which predates it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{SERVER_NAMES}};

    ssl_certificate     /etc/letsencrypt/live/{{PRIMARY_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{PRIMARY_DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:toymart_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root {{APP_ROOT}}/current/public;
    index index.php;
    charset utf-8;

    # The largest upload the API accepts is 10 MB (media, imports, receipts); a little headroom
    # for the multipart envelope. Keep in step with php.ini (upload_max_filesize/post_max_size).
    client_max_body_size {{CLIENT_MAX_BODY}};

    access_log /var/log/nginx/toymartbd.access.log toymart_json;
    error_log  /var/log/nginx/toymartbd.error.log warn;

    # Admin bundle: content-hashed file names, so cache for a year. ^~ — nothing under it ever
    # reaches PHP.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (product media renditions) via public/storage -> shared/storage/app/public.
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Dotfiles (.env lives one level up, but never rely on that alone).
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller executes. $realpath_root resolves the `current` symlink per
    # request, so a release swap takes effect without nginx caching the old path.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_REQUEST_ID $toymart_request_id;
        fastcgi_pass unix:/run/php/php8.4-fpm-toymartbd.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }
}
