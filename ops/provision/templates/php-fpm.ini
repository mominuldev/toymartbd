; Toy Mart BD — PHP-FPM overrides (ops/provision). /etc/php/8.4/fpm/conf.d/99-toymartbd.ini
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 12M
post_max_size = 16M
date.timezone = UTC

; Release swaps reload PHP-FPM (deploy.sh), which empties opcache — so never stat files.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
